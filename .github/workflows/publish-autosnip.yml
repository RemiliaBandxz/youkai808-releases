name: Publish AutoSnip installer
# youkai808-source is private, so its release assets 404 for users. This reassembles the committed
# split parts into a PUBLIC Release asset the Hub downloads, verifies the link, then removes the parts.
on:
  workflow_dispatch:
    inputs:
      version: { description: "AutoSnip version, e.g. 0.2.8", required: true }
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ github.token }}" }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          v="${{ github.event.inputs.version }}"
          f="AutoSnip-v$v-Setup.exe"; tag="autosnip-v$v"
          ls releases/autosnip/$f.* >/dev/null   # fail loudly if the parts aren't committed
          cat releases/autosnip/$f.* > "$f"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "$tag" "$f" --clobber -R "$GITHUB_REPOSITORY" \
            || gh release create "$tag" "$f" -R "$GITHUB_REPOSITORY" --title "AutoSnip $v" --notes "AutoSnip installer for the Youkai Hub."
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$f"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L -r 0-0 "$url")
          echo "asset $url -> $code"
          [ "$code" = "200" ] || [ "$code" = "206" ] || { echo "::error::update link is not publicly downloadable ($code)"; exit 1; }
          # the Hub refuses a cut-off download only when it knows the real size
          python3 - "$v" "$url" "$(stat -c%s "$f")" <<'PY'
          import json, sys
          v, url, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          d = json.load(open("autosnip-versions.json"))
          e = next((x for x in d["versions"] if x["version"] == v), None)
          if e is None: e = {"version": v}; d["versions"].insert(0, e)
          e["windows"], e["size"] = url, size
          d["latest"] = v  # the in-app updater checks `latest`; bump it or a freshly published version never offers the update
          json.dump(d, open("autosnip-versions.json", "w"), indent=2); open("autosnip-versions.json", "a").write("\n")
          PY
      - name: Drop the parts (the public release asset is the source of truth now)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="${{ github.event.inputs.version }}"
          git config user.name github-actions; git config user.email actions@github.com
          git rm -q releases/autosnip/AutoSnip-v$v-Setup.exe.* 2>/dev/null || true
          git add autosnip-versions.json
          git diff --cached --quiet && exit 0
          git commit -qm "AutoSnip $v: release asset published (url + size), parts removed from tree"
          git push origin HEAD:main
