<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecting… · Youkai Digital</title>
  <meta http-equiv="refresh" content="1;url=/youkai808-releases/">
  <script>
    (function () {
      var base = "/youkai808-releases/";
      var path = window.location.pathname || "";
      var search = window.location.search || "";
      var hash = window.location.hash || "";

      // Recover percent-encoded fragments (e.g. /%23plugins from social link-in-bio URLs).
      var idx = path.toLowerCase().indexOf("%23");
      if (idx !== -1 && !hash) {
        var frag = decodeURIComponent(path.slice(idx + 3)).replace(/\/+$/, "");
        if (frag) hash = "#" + frag;
      }

      window.location.replace(base + search + hash);
    })();
  </script>
</head>
